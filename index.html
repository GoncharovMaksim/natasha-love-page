<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Для Наташи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="ambient-canvas"></canvas>

  <main class="container">
    <!-- Countdown view -->
    <div id="timer-view" class="view-block">
      <div class="timer-badge">Таймер ожидания</div>
      <div class="timer-display-wrapper">
        <svg class="timer-ring" width="220" height="220" viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="96" />
          <circle id="ring-progress" class="ring-fg" cx="110" cy="110" r="96" />
        </svg>
        <span id="countdown-number" class="countdown-val">5</span>
      </div>
      <p class="timer-subtext">Секундочку...</p>
    </div>

    <!-- Flower and Message view (hidden initially) -->
    <div id="reveal-view" class="view-block hidden">
      <div class="flower-container">
        <svg class="flower-svg" viewBox="0 0 320 380" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="stemGrad" x1="160" y1="180" x2="160" y2="360" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#34d399" />
              <stop offset="100%" stop-color="#065f46" />
            </linearGradient>
            <linearGradient id="leafGradLeft" x1="100" y1="260" x2="160" y2="280" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="100%" stop-color="#047857" />
            </linearGradient>
            <linearGradient id="leafGradRight" x1="160" y1="240" x2="220" y2="270" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#34d399" />
              <stop offset="100%" stop-color="#065f46" />
            </linearGradient>
            <radialGradient id="centerCore" cx="160" cy="140" r="30" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fef08a" />
              <stop offset="60%" stop-color="#f59e0b" />
              <stop offset="100%" stop-color="#b45309" />
            </radialGradient>
            <linearGradient id="petalGrad1" x1="160" y1="60" x2="160" y2="150" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fb7185" />
              <stop offset="50%" stop-color="#f43f5e" />
              <stop offset="100%" stop-color="#be123c" />
            </linearGradient>
            <linearGradient id="petalGrad2" x1="100" y1="80" x2="160" y2="140" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fda4af" />
              <stop offset="50%" stop-color="#fb7185" />
              <stop offset="100%" stop-color="#e11d48" />
            </linearGradient>
            <linearGradient id="petalGrad3" x1="220" y1="80" x2="160" y2="140" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fda4af" />
              <stop offset="50%" stop-color="#fb7185" />
              <stop offset="100%" stop-color="#e11d48" />
            </linearGradient>
            <filter id="bloomGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="8" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Stem -->
          <path class="stem" d="M160 150 Q 158 250 160 360" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round" />

          <!-- Leaves -->
          <path class="leaf leaf-left" d="M160 270 C 130 265 105 245 95 230 C 105 260 135 285 160 280 Z" fill="url(#leafGradLeft)" />
          <path class="leaf leaf-right" d="M160 245 C 190 235 220 220 230 205 C 220 235 185 260 160 255 Z" fill="url(#leafGradRight)" />

          <!-- Outer Petals Layer -->
          <g class="petals-outer" filter="url(#bloomGlow)">
            <!-- Top Petal -->
            <path class="petal p-top" d="M160 140 C 130 80 130 40 160 30 C 190 40 190 80 160 140 Z" fill="url(#petalGrad1)" />
            <!-- Top-Right Petal -->
            <path class="petal p-tr" d="M160 140 C 195 90 235 85 245 110 C 235 140 195 150 160 140 Z" fill="url(#petalGrad3)" />
            <!-- Bottom-Right Petal -->
            <path class="petal p-br" d="M160 140 C 205 155 230 185 215 205 C 185 210 170 175 160 140 Z" fill="url(#petalGrad2)" />
            <!-- Bottom-Left Petal -->
            <path class="petal p-bl" d="M160 140 C 115 155 90 185 105 205 C 135 210 150 175 160 140 Z" fill="url(#petalGrad2)" />
            <!-- Top-Left Petal -->
            <path class="petal p-tl" d="M160 140 C 125 90 85 85 75 110 C 85 140 125 150 160 140 Z" fill="url(#petalGrad2)" />
          </g>

          <!-- Inner Rosebud Petals -->
          <g class="petals-inner">
            <path class="petal p-in-1" d="M160 140 C 145 105 145 85 160 80 C 175 85 175 105 160 140 Z" fill="#ffe4e6" opacity="0.9" />
            <path class="petal p-in-2" d="M160 140 C 175 115 195 110 200 125 C 195 145 175 145 160 140 Z" fill="#fecdd3" opacity="0.9" />
            <path class="petal p-in-3" d="M160 140 C 145 115 125 110 120 125 C 125 145 145 145 160 140 Z" fill="#fda4af" opacity="0.9" />
          </g>

          <!-- Flower Core -->
          <circle class="core" cx="160" cy="140" r="14" fill="url(#centerCore)" />
          <circle class="core-spark" cx="157" cy="137" r="4" fill="#ffffff" opacity="0.6" />
        </svg>
      </div>

      <div class="message-wrapper">
        <h1 class="main-title">
          <span class="name-part">Наташа,</span>
          <span class="love-part">я люблю тебя</span>
        </h1>
        <div class="heart-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="#f43f5e" fill-opacity="0.2"/>
          </svg>
        </div>
      </div>

      <button id="replay-btn" class="replay-btn" type="button">
        Повторить снова
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
